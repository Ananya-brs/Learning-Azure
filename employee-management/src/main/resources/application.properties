spring.application.name=employee-management

spring.datasource.url=jdbc:mysql://localhost:3306/employeedb?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Azure Service Bus — override in application-local.properties or env var AZURE_SERVICEBUS_CONNECTION_STRING
app.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
app.servicebus.queue-name=employee-service

# Loaded last so application-local.properties overrides defaults above
spring.config.import=optional:classpath:application-local.properties
